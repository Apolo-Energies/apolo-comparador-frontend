<article
  class="group relative cursor-pointer select-none rounded-lg bg-card border border-border hover:border-primary transition-colors duration-150"
  (click)="open.emit(opportunity())"
>
  <div class="px-3 pt-2.5 pb-2.5 space-y-1.5">
    <!-- Title row -->
    <div class="flex items-start justify-between gap-2">
      <h3
        class="text-sm font-semibold text-foreground leading-snug line-clamp-2"
      >
        {{ titleText() }}
      </h3>
      @if (opportunity().comparisonsCount > 0) {
        <span
          class="shrink-0 inline-flex items-center justify-center min-w-6 rounded-full px-2 py-0 text-xs leading-5 tabular-nums text-foreground ring-1 ring-inset ring-border"
          [title]="opportunity().comparisonsCount + ' comparaciones guardadas'"
        >
          {{ opportunity().comparisonsCount }}
        </span>
      }
    </div>

    <!-- Tarifa -->
    <div
      class="text-[13px] font-medium"
      [class]="opportunity().tariff ? 'opp-tariff' : 'text-muted-foreground italic'"
    >
      {{ subtitleText() }}
    </div>

    <!-- CUPS chip + consumo -->
    <div class="space-y-1.5">
      <span
        class="block font-mono text-[11px] text-foreground/80 truncate bg-muted rounded-[5px] px-1.5 py-[3px]"
      >
        {{ opportunity().cups }}
      </span>
      @if (consumption() !== null && consumption() !== undefined) {
        <span
          class="inline-flex items-center gap-1 text-xs tabular-nums text-warning bg-warning/10 rounded-full px-2 py-0"
        >
          <lib-apolo-icons [icon]="flashIcon" class="flex items-center shrink-0" />
          {{ consumption() | esNumber }} kWh
        </span>
      }
    </div>
  </div>

  <!-- Footer -->
  <div
    class="mx-3 py-1.5 border-t border-border flex items-center justify-between text-xs text-muted-foreground"
  >
    <span class="inline-flex items-center gap-1.5 truncate">
      <lib-apolo-icons [icon]="userIcon" class="flex items-center shrink-0 text-muted-foreground" />
      <span class="truncate max-w-35">{{ creatorText() }}</span>
    </span>
    <span class="shrink-0 inline-flex items-center gap-1.5 text-muted-foreground">
      <lib-apolo-icons [icon]="dateIcon" class="flex items-center shrink-0" />
      {{ relativeDate() }}
    </span>
  </div>
</article>
