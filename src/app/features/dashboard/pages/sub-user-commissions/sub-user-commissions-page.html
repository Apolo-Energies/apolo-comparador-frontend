<ui-alert />

<!-- Commission input cell -->
<ng-template #commTpl let-row>
  <input
    type="number"
    min="0"
    max="100"
    step="0.5"
    [(ngModel)]="row.draftPercentage"
    placeholder="0"
    class="w-24 px-2 py-1 text-sm text-center rounded-md border bg-card border-border text-foreground focus:border-blue-500 focus:ring-1 focus:ring-blue-500/20 focus:outline-none transition-all"
  />
</ng-template>

<!-- Actions cell -->
<ng-template #actionsTpl let-row>
  <div class="flex items-center justify-center gap-3">
    <button
      class="text-xs font-medium text-primary-button hover:underline disabled:opacity-40"
      [disabled]="row.saving"
      (click)="onSave(row)"
    >
      Guardar
    </button>
    @if (row.commissionPercentage !== null) {
      <button
        class="inline-flex items-center gap-1 text-xs text-red-500 hover:text-red-700 transition-colors disabled:opacity-40"
        [disabled]="row.saving"
        (click)="onDelete(row)"
      >
        <lib-apolo-icons [icon]="deleteIcon" class="flex items-center" />
        Quitar
      </button>
    }
  </div>
</ng-template>

<div class="border border-border rounded-lg overflow-hidden shadow-sm">

  <!-- Header -->
  <div class="bg-card px-6 py-4 flex items-start justify-between gap-4">
    <div class="min-w-0">
      @if (isMasterMode()) {
        <button
          type="button"
          class="mb-1 inline-flex items-center gap-1 text-xs text-muted-foreground hover:text-foreground transition-colors"
          (click)="goBackToUsers()"
        >
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m15 18-6-6 6-6"/>
          </svg>
          Volver a Usuarios
        </button>
      }
      <p class="text-base font-semibold text-foreground truncate">{{ title() }}</p>
      <p class="text-sm text-muted-foreground">{{ subtitle() }}</p>
    </div>
  </div>

  <!-- Table -->
  <div class="relative">
    @if (loading()) {
      <app-table-skeleton [cols]="4" [rows]="6" />
    } @else {
      <lib-data-table
        [data]="data()"
        [columns]="columns"
        rowKey="userId"
        [borderTop]="false"
        [borderBottom]="false"
        [borderLeft]="false"
        [borderRight]="false"
        [roundedTopLeft]="false"
        [roundedTopRight]="false"
        [roundedBottomLeft]="false"
        [roundedBottomRight]="false"
      />
      @if (data().length === 0) {
        <div class="py-12 text-center text-sm text-muted-foreground">
          {{ emptyMessage() }}
        </div>
      }
    }
  </div>

</div>
