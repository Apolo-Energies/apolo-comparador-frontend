<ui-alert />

<!-- Status cell -->
<ng-template #statusTpl let-row>
  <span class="text-sm">{{ row.isActive ? 'Active' : 'Inactive' }}</span>
</ng-template>

<!-- Commission cell -->
<ng-template #commTpl let-row>
  <span class="text-sm text-foreground">
    {{ row.commissionPercentage !== null ? (row.commissionPercentage + '%') : '—' }}
  </span>
</ng-template>

<!-- Actions cell -->
<ng-template #actionsTpl let-row>
  <app-user-actions-menu [user]="toSubUserRow(row)" (updated)="load()" />
</ng-template>

<div class="border border-border rounded-lg overflow-hidden shadow-sm">

  <!-- Header -->
  <div class="bg-card px-6 py-4 flex items-center justify-between">
    <div>
      <p class="text-base font-semibold text-foreground">Comerciales</p>
    </div>
    <ui-button label="Agregar Comercial" variant="default" size="md" [leadingIcon]="addIcon" (click)="onOpenModal()" />
  </div>

  <!-- Table -->
  <div class="relative">
    @if (loading()) {
      <app-table-skeleton [cols]="5" [rows]="6" />
    } @else {
      <lib-data-table [data]="data()" [columns]="columns" rowKey="userId" [borderTop]="false" [borderBottom]="false"
        [borderLeft]="false" [borderRight]="false" [roundedTopLeft]="false" [roundedTopRight]="false"
        [roundedBottomLeft]="false" [roundedBottomRight]="false" />
      @if (data().length === 0) {
        <div class="py-12 text-center text-sm text-muted-foreground">
          Aún no hay comerciales. Crea el primero con el botón "Agregar Comercial".
        </div>
      }
    }
  </div>

</div>

<app-add-commercial-modal
  [open]="modalOpen()"
  [saving]="saving()"
  (saveRequested)="onCreate($event)"
  (cancelled)="onCancel()"
/>
