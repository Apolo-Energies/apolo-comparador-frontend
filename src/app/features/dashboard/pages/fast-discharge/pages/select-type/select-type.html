<div class="min-h-full flex items-start justify-center pt-12 sm:pt-20 px-4">
  <div class="w-full max-w-5xl space-y-8">

    <div class="text-center space-y-2">
      <h1 class="text-xl sm:text-2xl font-semibold text-foreground">¿Qué quieres dar de alta?</h1>
      <p class="text-sm sm:text-base text-muted-foreground">Elige el tipo de suministro para empezar el proceso.</p>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 sm:gap-1 justify-items-center">
      <button
        type="button"
        class="group cursor-pointer w-full max-w-80 sm:max-w-96 rounded-2xl border border-border bg-card hover:border-2 hover:border-ring hover:shadow-xl transition-all px-6 py-10 sm:py-18 flex flex-col items-center gap-6"
        (click)="selectLuz()"
      >
        <img [src]="illustration" alt="" class="h-72 sm:h-96 w-auto max-w-full" />
        <span class="text-xl sm:text-2xl font-bold text-foreground group-hover:text-ring transition-colors">Luz</span>
      </button>

      <button
        type="button"
        class="group cursor-pointer w-full max-w-80 sm:max-w-96 rounded-2xl border border-border bg-card hover:border-2 hover:border-ring hover:shadow-xl transition-all px-6 py-10 sm:py-18 flex flex-col items-center gap-6"
        (click)="selectGas()"
      >
        <img [src]="illustration" alt="" class="h-72 sm:h-96 w-auto max-w-full" />
        <span class="text-xl sm:text-2xl font-bold text-foreground group-hover:text-ring transition-colors">Gas</span>
      </button>
    </div>

  </div>
</div>
