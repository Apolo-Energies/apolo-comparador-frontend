<div>

  <app-analytics-hub-nav section="reports">
    <div actions class="flex items-center">
    @if (loading()) {
        <app-brand-loader
          [inline]="true"
          [size]="32"
          [showTitle]="false"
          [showDescription]="false"
          [showBar]="false"
          [showPercent]="false"
          [showMicrocopy]="false"
          [showWordmark]="false"
          [showBackdrop]="false" />
      } @else {
        <button
          class="flex items-center gap-2 px-3 py-1.5 rounded-lg bg-card border border-border text-muted-foreground text-xs font-semibold hover:bg-body hover:text-foreground transition-colors cursor-pointer"
          (click)="load()">
          <svg class="size-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 4v5h-5"/></svg>
        Actualizar
        </button>
      }
    </div>
  </app-analytics-hub-nav>

  <!-- Pestañas internas (cambian contenido en la misma página): patrón ARIA tabs.
       La selección sigue al foco con flechas (selectTabByKey). -->
  <div class="mb-6 inline-flex gap-0.5 rounded-lg border border-border bg-card p-[3px]" role="tablist" aria-label="Tipo de reporte">
    @for (tab of tabs; track tab.id) {
      <button type="button" role="tab" [id]="'report-tab-' + tab.id"
        [attr.aria-selected]="activeTab() === tab.id" [tabindex]="activeTab() === tab.id ? 0 : -1"
        class="report-tab relative rounded-md px-4 py-1.5 text-sm font-medium transition-colors duration-150 cursor-pointer"
        [class]="activeTab() === tab.id ? 'bg-primary text-white' : 'text-muted-foreground hover:bg-accent hover:text-foreground'"
        (click)="setTab(tab.id)" (keydown)="onTabKey($event)">
        {{ tab.label }}
        @if (tab.id === 'alertas' && alertBadge() > 0) {
          <span class="absolute -top-1.5 -right-1.5 bg-danger text-white text-[10px] font-bold rounded-full min-w-4 h-4 px-1 flex items-center justify-center leading-none tabular-nums"
                [attr.aria-label]="alertBadge() + ' alertas'">
            {{ alertBadge() > 9 ? '9+' : alertBadge() }}
          </span>
        }
      </button>
    }
  </div>

  <!-- Tab content -->
  <div role="tabpanel" [attr.aria-labelledby]="'report-tab-' + activeTab()">
  @if (activeTab() === 'analitica') {
    <app-reports-analytics-tab
      [loading]="loading()"
      [summary]="summary()"
      [daily]="daily()"
      [totalComparativas]="totalComparativas()"
      [rows]="historyItems()"
      [colabRows]="colabRows()"
      [colabPeriod]="colabPeriod()"
      [colabLoading]="colabLoading()"
      (colabPeriodChange)="onColabPeriodChange($event)" />
  }

  @if (activeTab() === 'oportunidades') {
    <app-reports-opportunities-tab
      [loading]="loading()"
      [opps]="opps()" />
  }

  @if (activeTab() === 'alertas') {
    <app-reports-alerts-tab
      [loading]="loading()"
      [criticalCount]="criticalCount()"
      [warningCount]="warningCount()"
      [activeOppCount]="activeOppCount()"
      [alertBadge]="alertBadge()"
      [stagnant]="stagnant()" />
  }
  </div>

</div>
