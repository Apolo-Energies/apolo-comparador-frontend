<div class="flex h-full w-full flex-col items-center justify-center gap-4 px-4">
  @if (luzUrl) {
    <app-energy-route-toggle [luzUrl]="luzUrl" [gasUrl]="gasUrl" />
  }

  <div class="w-full max-w-md rounded-2xl bg-card p-8 text-center shadow-md">
    <h2 class="text-xl font-semibold text-foreground">{{ title }}</h2>
    <p class="mt-2 text-sm text-muted-foreground">{{ description }}</p>
  </div>
</div>
