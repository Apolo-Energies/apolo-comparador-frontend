@if (loading()) {
  <div class="fixed inset-0 z-50 flex flex-col items-center justify-center gap-3 bg-body/85 backdrop-blur-sm" role="status" aria-live="polite">
    <app-brand-loader [inline]="true" [size]="96"
      [showWordmark]="false" [showTitle]="false" [showDescription]="false"
      [showBar]="false" [showPercent]="false" [showMicrocopy]="false" [showBackdrop]="false" />
    <p class="text-sm font-medium tracking-wide text-foreground">Cargando...</p>
  </div>
}
